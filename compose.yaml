name: edumeeting

services:
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edumeeting}
      POSTGRES_USER: ${POSTGRES_USER:-edumeeting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  backup-before-migrate:
    image: postgres:17-alpine
    environment: &backup_environment
      POSTGRES_DB: ${POSTGRES_DB:-edumeeting}
      POSTGRES_USER: ${POSTGRES_USER:-edumeeting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      POSTGRES_HOST: db
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_LABEL: antes-de-migrar
    entrypoint: ["sh", "/backup.sh", "once"]
    volumes: &backup_volumes
      - ./docker/backup/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: *backup_environment
    entrypoint: ["sh", "/backup.sh", "loop"]
    volumes: *backup_volumes
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./edumeeting-server
    image: edumeeting-web
    env_file: .env
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Configura DJANGO_SECRET_KEY en .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_SECURE_SSL_REDIRECT: "0"
      POSTGRES_DB: ${POSTGRES_DB:-edumeeting}
      POSTGRES_USER: ${POSTGRES_USER:-edumeeting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && python manage.py collectstatic --noinput && daphne -b 0.0.0.0 -p 8000 config.asgi:application
    ports:
      - "127.0.0.1:${EDUMEETING_PORT:-8080}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backup-before-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=5); c.request('GET','/health/'); r=c.getresponse(); raise SystemExit(0 if r.status==200 else 1)"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 10

  worker:
    image: edumeeting-web
    env_file: .env
    environment: &worker_environment
      DJANGO_DEBUG: "1"
      POSTGRES_DB: ${POSTGRES_DB:-edumeeting}
      POSTGRES_USER: ${POSTGRES_USER:-edumeeting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5 >/dev/null"]
      interval: 30s
      timeout: 20s
      start_period: 30s
      retries: 3
    depends_on:
      web:
        condition: service_healthy

  scheduler:
    image: edumeeting-web
    env_file: .env
    environment: *worker_environment
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
