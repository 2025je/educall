services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-educall}
      POSTGRES_USER: ${POSTGRES_USER:-educall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: ./educall-server
    env_file: .env
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Configura DJANGO_SECRET_KEY en .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_SECURE_SSL_REDIRECT: "0"
      POSTGRES_DB: ${POSTGRES_DB:-educall}
      POSTGRES_USER: ${POSTGRES_USER:-educall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000 --noreload
    ports:
      - "127.0.0.1:${EDUCALL_PORT:-8080}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=5); c.request('GET','/accounts/login/'); r=c.getresponse(); raise SystemExit(0 if r.status==200 else 1)"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 10

volumes:
  postgres_data:
