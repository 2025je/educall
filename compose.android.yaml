name: edumeeting

x-android-build: &android_build
  image: edumeeting-android-builder
  build: ./docker/android
  environment: &android_environment
    BUILD_TYPE: ${BUILD_TYPE:-debug}
    VERSION_CODE: ${VERSION_CODE:-}
    VERSION_NAME: ${VERSION_NAME:-}
    ANDROID_KEYSTORE_BASE64: ${ANDROID_KEYSTORE_BASE64:-}
    EDUMEETING_KEYSTORE_PASSWORD: ${EDUMEETING_KEYSTORE_PASSWORD:-}
    EDUMEETING_KEY_ALIAS: ${EDUMEETING_KEY_ALIAS:-}
    EDUMEETING_KEY_PASSWORD: ${EDUMEETING_KEY_PASSWORD:-}
    ALLOW_DEBUG_SIGNED_RELEASE: ${ALLOW_DEBUG_SIGNED_RELEASE:-0}
    SCREENSHOTS: ${SCREENSHOTS:-auto}

services:
  llamadas:
    <<: *android_build
    environment:
      <<: *android_environment
      APP_NAME: edumeeting-llamadas
    volumes:
      - ./edumeeting-llamadas:/source/edumeeting-llamadas:ro
      - ./edumeeting-ui:/source/edumeeting-ui:ro
      - ./artifacts/android:/output
      - gradle_cache:/root/.gradle
      - android_debug_keys:/root/.android
      # Robolectric descarga android-all la primera vez a ~/.m2.
      - robolectric_cache:/root/.m2

  asistencia:
    <<: *android_build
    environment:
      <<: *android_environment
      APP_NAME: edumeeting-asistencia
      ATTENDANCE_SIGNING_PUBLIC_KEY: ${ATTENDANCE_SIGNING_PUBLIC_KEY:-}
    volumes:
      - ./edumeeting-asistencia:/source/edumeeting-asistencia:ro
      - ./edumeeting-ui:/source/edumeeting-ui:ro
      - ./artifacts/android:/output
      - gradle_cache:/root/.gradle
      - android_debug_keys:/root/.android
      # Robolectric descarga android-all la primera vez a ~/.m2.
      - robolectric_cache:/root/.m2

volumes:
  gradle_cache:
  android_debug_keys:
  robolectric_cache:
