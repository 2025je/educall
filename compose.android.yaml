name: edumeeting

services:
  llamadas:
    image: edumeeting-android-builder
    build: ./docker/android
    environment:
      APP_NAME: edumeeting-llamadas
    volumes:
      - ./edumeeting-llamadas:/source/edumeeting-llamadas:ro
      - ./edumeeting-ui:/source/edumeeting-ui:ro
      - ./artifacts/android:/output
      - gradle_cache:/root/.gradle
      - android_debug_keys:/root/.android

  asistencia:
    image: edumeeting-android-builder
    build: ./docker/android
    environment:
      APP_NAME: edumeeting-asistencia
      ATTENDANCE_SIGNING_PUBLIC_KEY: ${ATTENDANCE_SIGNING_PUBLIC_KEY:-}
    volumes:
      - ./edumeeting-asistencia:/source/edumeeting-asistencia:ro
      - ./edumeeting-ui:/source/edumeeting-ui:ro
      - ./artifacts/android:/output
      - gradle_cache:/root/.gradle
      - android_debug_keys:/root/.android

volumes:
  gradle_cache:
  android_debug_keys:
