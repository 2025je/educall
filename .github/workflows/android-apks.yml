name: Android APKs

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/android-apks.yml"
      - "edumeeting-llamadas/**"
      - "edumeeting-asistencia/**"
      - "edumeeting-ui/**"
      - "docker/android/**"
      - "compose.android.yaml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/android-apks.yml"
      - "edumeeting-llamadas/**"
      - "edumeeting-asistencia/**"
      - "edumeeting-ui/**"
      - "docker/android/**"
      - "compose.android.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK ${{ matrix.app }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [llamadas, asistencia]
    env:
      ATTENDANCE_SIGNING_PUBLIC_KEY: ${{ vars.ATTENDANCE_SIGNING_PUBLIC_KEY }}
      # Los tags v* generan un release firmado con el keystore estable; el resto, APKs debug.
      BUILD_TYPE: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'debug' }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.0-dev.{0}', github.run_number) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Validate attendance public key
        if: matrix.app == 'asistencia'
        shell: python
        run: |
          import base64
          import binascii
          import os

          key = os.environ.get("ATTENDANCE_SIGNING_PUBLIC_KEY", "")
          try:
              valid = len(base64.b64decode(key, validate=True)) == 32
          except (ValueError, binascii.Error):
              valid = False
          if not valid:
              raise SystemExit(
                  "Configura la variable de repositorio ATTENDANCE_SIGNING_PUBLIC_KEY "
                  "con la clave publica Ed25519 del servidor (32 bytes en Base64). "
                  "Settings > Secrets and variables > Actions > Variables."
              )

      - name: Normalize version name
        run: echo "VERSION_NAME=${VERSION_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Android builder
        uses: docker/build-push-action@v7
        with:
          context: ./docker/android
          load: true
          tags: edumeeting-android-builder:latest
          cache-from: type=gha,scope=android-builder
          cache-to: type=gha,mode=max,scope=android-builder

      - name: Test and build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ env.BUILD_TYPE == 'release' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          EDUMEETING_KEYSTORE_PASSWORD: ${{ env.BUILD_TYPE == 'release' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          EDUMEETING_KEY_ALIAS: ${{ env.BUILD_TYPE == 'release' && secrets.ANDROID_KEY_ALIAS || '' }}
          EDUMEETING_KEY_PASSWORD: ${{ env.BUILD_TYPE == 'release' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: docker compose -f compose.android.yaml run --rm --pull never ${{ matrix.app }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: edumeeting-${{ matrix.app }}-${{ env.BUILD_TYPE }}
          path: artifacts/android/edumeeting-${{ matrix.app }}-${{ env.BUILD_TYPE }}.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v8
        with:
          pattern: edumeeting-*-release
          path: apks
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd apks
          for apk in edumeeting-*-release.apk; do mv "$apk" "${apk%-release.apk}-${TAG}.apk"; done
          sha256sum ./*.apk > SHA256SUMS.txt
          gh release create "$TAG" ./*.apk SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "EduMeeting $TAG" --generate-notes